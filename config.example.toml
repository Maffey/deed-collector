# deed-collector configuration (example).
#
# Copy this file to `config.toml` and edit the values so they match your
# spreadsheet, e.g.:
#
#     cp config.example.toml config.toml
#
# Running the CLI without a `config.toml` prompts you to build one
# interactively; `deed-collector --setup ...` re-runs that wizard.

# Target worksheet. Every key is optional, and CLI values override the file:
#   * `spreadsheet_id` may instead be passed as the second positional argument
#   * `sheet_name` may instead be passed with --sheet-name/-w
#   * `header_row` may instead be passed with --header-row/-r
#   * `comment` may instead be passed with --comment
#
# `spreadsheet_id` has no default, so it must be set here or on the CLI.
[worksheet]
spreadsheet_id = "your-spreadsheet-id"
sheet_name = "Sheet1"
header_row = 1
# Static text written to the comment column of every appended row. Leave empty
# (or delete the line) to write nothing. Set the target column below.
comment = ""

# Column mapping. Each key is a field scraped from a listing; each value is the
# header of the worksheet column it should be written to. Leave a value as ""
# (or delete the line) to skip exporting that field. Matching ignores case and
# surrounding whitespace.
[worksheet_mapping]
provider = "portal"
url = "listing url"
address = "address (for map)"
price = "price"
area = "area (m²)"
price_per_square_meter = "price/m²"
number_of_rooms = "rooms"
market_type = "market"
year_of_construction = "year built"
collected_date = "date added"
comment = "notes"
